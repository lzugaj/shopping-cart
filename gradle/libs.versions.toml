[versions]
spring-boot = "4.1.0"

[libraries]
# Spring Boot
spring-boot-docker-compose = { module = "org.springframework.boot:spring-boot-docker-compose", version.ref = "spring-boot" }
spring-boot-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "spring-boot" }
spring-boot-validation = { module = "org.springframework.boot:spring-boot-starter-validation", version.ref = "spring-boot" }
spring-boot-mongodb = { module = "org.springframework.boot:spring-boot-starter-data-mongodb", version.ref = "spring-boot" }

# Swagger
swagger = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version = "3.0.3" }

# Testing
spring-boot-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "spring-boot" }
spring-boot-mongodb-test = { module = "org.springframework.boot:spring-boot-data-mongodb-test", version.ref = "spring-boot" }
spring-boot-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test", version.ref = "spring-boot" }
spring-boot-webtestclient = { module = "org.springframework.boot:spring-boot-webtestclient", version.ref = "spring-boot" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers", version.ref = "spring-boot" }
testcontainers-mongodb = { module = "org.testcontainers:testcontainers-mongodb", version = "2.0.1" }

[plugins]
java = { id = "java" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version = "1.1.7" }
lombok = { id = "io.freefair.lombok", version = "9.0.0" }
jacoco = { id = "jacoco" }
